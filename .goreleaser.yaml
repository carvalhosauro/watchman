version: 2
project_name: watchman
before:
  hooks:
    - go mod tidy
    - go run ./cmd/gen-docs # writes completions/ + manpages/ for the archives
builds:
  - id: wm
    binary: wm
    main: ./cmd/wm
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/carvalhosauro/watchman/cmd.version={{ .Version }}
archives:
  - id: wm
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "wm_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - completions/*
      - manpages/*
checksum:
  name_template: checksums.txt
changelog:
  disable: true
release:
  github:
    owner: carvalhosauro
    name: watchman


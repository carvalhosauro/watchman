name: CI
on:
  push:
    branches: [main, v2-go]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: test -z "$(gofmt -l .)"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
      - run: bash scripts/coverage.sh 70
      - run: go build -o wm .

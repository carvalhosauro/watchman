version: "2"
linters:
  default: standard
  enable:
    - revive
    - misspell
    - unconvert
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - misspell # test fixtures carry Portuguese CVM feed text (dividendos, comunicado)
formatters:
  enable:
    - gofmt
    - goimports
